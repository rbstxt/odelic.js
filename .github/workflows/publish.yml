name: Publish to npm

# Runs when a GitHub release is published. Uses npm Trusted Publishing (OIDC, no token needed):
# npmjs.com > odelic > Settings > Trusted Publisher > GitHub Actions:
#   organization/user rbstxt, repository odelic.js, workflow publish.yml
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write   # OIDC for trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # no registry-url: setup-node would write a placeholder NODE_AUTH_TOKEN that npm falls back to
      - name: Check tag matches package version
        run: |
          v=$(node -p "require('./package.json').version")
          test "${GITHUB_REF_NAME#v}" = "$v" || { echo "tag $GITHUB_REF_NAME != version $v"; exit 1; }
      - run: npm install -g npm@^11.5.1   # trusted publishing needs npm >= 11.5.1
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm publish --loglevel verbose   # prepack builds dist/; OIDC exchange is logged
